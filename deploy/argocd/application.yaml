apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rysekk/low-latency-observability
    targetRevision: main
    path: deploy/k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: trading-app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true