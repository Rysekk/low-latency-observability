apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rysekk/low-latency-observability
    targetRevision: main
    path: deploy/k8s/monitoring/prometheus/
  destination:
    server: https://kubernetes.default.svc
    namespace: trading-app