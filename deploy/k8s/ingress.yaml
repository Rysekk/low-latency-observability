apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-app-observability
  namespace: trading-app
spec:
  ingressClassName: traefik
  rules:
  - host: "grafana.local"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: grafana
            port:
              number: 3000
  - host: "prometheus.local"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: prometheus
            port:
              number: 9090