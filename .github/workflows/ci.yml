name: CI

on:
  push:
    branches: [main]      # On witch branch

jobs:
  lintAndTint:
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v4        # Get codebase

      - uses: actions/setup-go@v7        # instal Go
        with:
          go-version: '1.26.5'          
      
      - name: lint                       # Lint
        run: go vet ./...
      
      - name: Run tests
        run: go test ./...               # test
  
  
  build-push:
    needs: lintAndTint
    runs-on: ubuntu-24.04
    
    permissions:
      packages: write

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: build/.
          push: true
          tags: ghcr.io/rysekk/low-latency-observability:${{ github.sha }}



      