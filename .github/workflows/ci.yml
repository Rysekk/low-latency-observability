name: CI

on:
  push:
    branches: [main]      # On witch branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # Get codebase

      - uses: actions/setup-go@v5        # instal Go
        with:
          go-version: '1.26.5'          
      
      - name: lint                       # Lint
        run: go vet ./...
      
      - name: Run tests
        run: go test ./...               # test
      